<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>PWA পরীক্ষা</title>
<style>body{margin:0;padding:16px;background:#0b0b10;color:#e8e8f0;font:15px/1.6 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}.r{padding:8px 10px;margin:6px 0;border-radius:8px;background:#181824;word-break:break-all}
.ok{border-left:4px solid #4ade80}.bad{border-left:4px solid #f87171}.warn{border-left:4px solid #fbbf24}small{color:#a9a9bd}</style></head>
<body><h1>MangaBooka — ইনস্টল ও ছবি পরীক্ষা</h1><div id="o">পরীক্ষা চলছে…</div>
<script>
var o=document.getElementById('o'),rows=[];
function add(c,t){rows.push('<div class="r '+c+'">'+t+'</div>');o.innerHTML=rows.join('')}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();add('ok','✔ ব্রাউজার ইনস্টল প্রম্পট দিয়েছে (ইনস্টলযোগ্য)')});
async function chk(url,kind,must){
  try{var r=await fetch(url+'?c='+Date.now(),{cache:'no-store'});var ct=r.headers.get('content-type')||'';
    var good=r.ok&&(!must||ct.indexOf(must)>-1);
    add(good?'ok':'bad',(good?'✔ ':'✖ ')+url+' <small>('+r.status+', '+ct.split(';')[0]+')</small>'+(good?'':'<br><small>'+(ct.indexOf('html')>-1?'ফাইলটি রিপোতে নেই বা ভুল জায়গায় (সাইট HTML পাতা দিচ্ছে)':'সমস্যা')+'</small>'));
    return good?r:null}catch(e){add('bad','✖ '+url+' খোলা যায়নি');return null}
}
(async function(){
  add('r','<small>'+navigator.userAgent+'</small>');
  add(location.protocol==='https:'?'ok':'bad',(location.protocol==='https:'?'✔':'✖')+' HTTPS');
  add(matchMedia('(display-mode: standalone)').matches?'warn':'r','অ্যাপ মোডে খোলা: '+(matchMedia('(display-mode: standalone)').matches?'হ্যাঁ (ইনস্টল করা আছে)':'না'));
  var m=await chk('/manifest.json','manifest','json');
  if(m){try{var j=await m.json();add(j.name&&j.start_url&&j.display?'ok':'bad','manifest: name='+j.name+', display='+j.display);
    for(var i=0;i<(j.icons||[]).length;i++){await chk(j.icons[i].src,'icon','image/png')}}catch(e){add('bad','✖ manifest JSON ভুল')}}
  await chk('/sw.js','sw','javascript');
  await chk('/offline.html','offline','html');
  await chk('/bg/anime-night-m.webp','bg','image');
  await chk('/bg/anime-night-d.webp','bg','image');
  try{var h=await (await fetch('/?c='+Date.now(),{cache:'no-store'})).text();
    var links=Array.from(h.matchAll(/<link[^>]+href=["']([^"']+\.css)["']/g)).map(function(x){return x[1]});
    var found=false;
    for(var k=0;k<links.length;k++){var t=await (await fetch(links[k]+'?c='+Date.now(),{cache:'no-store'})).text();if(t.indexOf('anime-night')>-1)found=true}
    add(found?'ok':'bad',(found?'✔':'✖')+' সাইটের CSS এ ব্যাকগ্রাউন্ড ছবির কোড আছে'+(found?'':'<br><small>'+(links.length?'CSS আছে কিন্তু তাতে ছবির কোড নেই: client/src/styles/anime.css ও client/src/main.jsx আপলোড হয়নি বা ডিপ্লয় বাকি':'index.html এ CSS লিংক পাওয়া যায়নি')+'</small>')+' <small>(CSS ফাইল: '+links.length+'টি)</small>')}catch(e){add('bad','✖ CSS পরীক্ষা করা যায়নি')}
  if('serviceWorker' in navigator){try{var regs=await navigator.serviceWorker.getRegistrations();
    add(regs.length?'ok':'bad',(regs.length?'✔':'✖')+' সার্ভিস ওয়ার্কার নিবন্ধিত: '+regs.length+'টি'+(regs.length?'':'<br><small>হোম পেজ একবার খুলে ৫ সেকেন্ড পর এই পেজ রিফ্রেশ করুন</small>'))}catch(e){add('bad','✖ SW পড়া যায়নি')}}
  else add('bad','✖ এই ব্রাউজারে সার্ভিস ওয়ার্কার নেই');
  add('r','<small>শেষ। এই পুরো পর্দার স্ক্রিনশট পাঠান।</small>');
})();
</script></body></html>
